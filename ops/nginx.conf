worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr","cache":"$upstream_cache_status","rid":"$request_id"}';
  access_log /dev/stdout json;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  limit_req_zone  $binary_remote_addr zone=api:10m rate=20r/s;   # gateway-level rate limit (the app has its own too)
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;  # login / register / reset: much stricter
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:10m max_size=100m inactive=10m use_temp_path=off;  # edge cache, CDN-style

  upstream foodshare {            # load balancing across stateless instances
    least_conn;
    server app1:3000 max_fails=2 fail_timeout=10s;
    server app2:3000 max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  server {                        # HTTP -> HTTPS (8443 is the published port in docker-compose.yml)
    listen 80;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;   # keep the port so the app's Origin check matches
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, so clients cannot spoof their IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_502 http_503;  # fail over to the other instance (idempotent requests only)
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    location = /metrics { return 404; }                  # never expose metrics through the public gateway

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://foodshare;
    }
    location /api/v1/ {                                  # API gateway role: versioned routing + throttling
      limit_req zone=api burst=40 nodelay;
      limit_req_status 429;
      limit_conn conn 30;
      proxy_pass http://foodshare;
    }
    location /api/ {                                     # any other API version is retired
      default_type application/json;
      return 410 '{"error":{"code":"version_gone","message":"Use /api/v1/"}}';
    }
    location / {
      proxy_pass http://foodshare;
      proxy_cache edge;
      proxy_cache_valid 200 5m;
      proxy_cache_use_stale error timeout updating http_503;
      add_header X-Cache-Status $upstream_cache_status;
    }
  }
}
