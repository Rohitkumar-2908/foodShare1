/* ---------- semantic-style search (synonym concepts + trigram similarity) ---------- */
var SYN=[["veg","vegetarian","vegan","plant"],["nonveg","meat","chicken","egg","mutton","fish"],["rice","biryani","pulao","khichdi"],["bread","roti","chapati","naan","paratha","bun","bakery","loaf"],["fruit","fruits","vegetable","vegetables","produce","fresh","sabzi","salad"],["packaged","packet","packets","snack","snacks","biscuit","biscuits","sealed"],["cooked","hot","curry","dal","dinner","lunch","meal","meals"]];
function toks(s){return s.toLowerCase().match(/[a-z]+/g)||[]}
function conc(t){var o={};t.forEach(function(w){SYN.forEach(function(g,i){if(g.indexOf(w)>=0)o[i]=1})});return Object.keys(o)}
function tg(s){s=" "+s.toLowerCase()+" ";var o={};for(var i=0;i<s.length-2;i++)o[s.substr(i,3)]=1;return o}
function sem(q,pool){
 if(!q.trim())return pool.slice().sort(function(a,b){return b.id-a.id});
 var qt=toks(q),qc=conc(qt),qg=tg(q),num=+(q.match(/\d+/)||[0])[0],nv=/non.?veg|meat|chicken|egg/i.test(q),vg=!nv&&/\bveg/i.test(q);
 return pool.map(function(d){
  if(num&&d.rem<num)return{d:d,s:0};if(vg&&d.diet==="nonveg")return{d:d,s:0};
  var txt=d.title+" "+CAT[d.cat]+" "+(d.diet==="veg"?"vegetarian":"nonveg meat egg")+" "+d.area,dt=toks(txt),dc=conc(dt),dg=tg(txt),s=0;
  qc.forEach(function(c){if(dc.indexOf(c)>=0)s+=2});qt.forEach(function(w){if(dt.indexOf(w)>=0)s+=3});
  var i=0,u=Object.keys(dg).length;Object.keys(qg).forEach(function(k){if(dg[k])i++;else u++});s+=i/Math.max(u,1)*3;
  if(num&&!qc.length&&s<.3)s=.2;return{d:d,s:s}}).filter(function(x){return x.s>.35||(num&&x.s>0)}).sort(function(a,b){return b.s-a.s}).map(function(x){return x.d});
}
