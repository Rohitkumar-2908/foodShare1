name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [22] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm audit --audit-level=high      # dependency vulnerabilities
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t foodshare:${{ github.sha }} .
      - name: Smoke test the image
        run: |
          docker run -d --name fs -p 3000:3000 foodshare:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/readyz && exit 0; sleep 1; done
          docker logs fs; exit 1
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    environment: staging        # add required reviewers in repo settings for a manual approval gate
    steps:
      - run: echo "STUB - add your deploy command here (for example SSH + docker compose pull && up -d). Nothing is deployed by this workflow yet."
